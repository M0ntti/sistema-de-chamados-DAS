spring.application.name=chamados

spring.datasource.url=jdbc:h2:mem:chamadosdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Swagger / OpenAPI (springdoc)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method

# Front-end: a pasta frontend/ (na raiz do projeto) fica disponivel em http://localhost:8080/
spring.web.resources.static-locations=classpath:/static/,file:frontend/
# Sem cache dos arquivos do front durante o desenvolvimento (F5 sempre pega a versao nova)
spring.web.resources.cache.period=0
